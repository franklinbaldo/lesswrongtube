<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LessWrongTube</title>
<meta name="description" content="YouTube videos that LessWrong commenters keep recommending, mined from 20 years of posts and comments. No login, no tracking.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fbfaf7; --panel: #ffffff; --ink: #1d1f1c; --muted: #6b6f68; --line: #e4e1d9;
  --accent: #2f6b4f; --accent-ink: #ffffff; --chip: #eef1ec; --shadow: 0 1px 2px rgb(0 0 0 / .06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141614; --panel: #1c1f1c; --ink: #e9ebe6; --muted: #9ba197; --line: #2c312c;
    --accent: #7cc3a0; --accent-ink: #0d1a13; --chip: #242a25; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #141614; --panel: #1c1f1c; --ink: #e9ebe6; --muted: #9ba197; --line: #2c312c;
  --accent: #7cc3a0; --accent-ink: #0d1a13; --chip: #242a25; --shadow: none;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 Inter, system-ui, sans-serif; }
a { color: inherit; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { max-width: 1400px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.logo { font: 600 21px "Source Serif 4", Georgia, serif; text-decoration: none; letter-spacing: -.01em; white-space: nowrap; }
.logo span { color: var(--accent); }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav a { text-decoration: none; padding: 6px 10px; border-radius: 999px; color: var(--muted); font-weight: 500; font-size: 14px; }
nav a.on { background: var(--chip); color: var(--ink); }
.search { flex: 1; min-width: 180px; }
.search input { width: 100%; padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--ink); font: inherit; }
main { max-width: 1400px; margin: 0 auto; padding: 18px 16px 60px; }
.sub { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; color: var(--muted); font-size: 14px; }
.chip { border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 5px 11px; border-radius: 999px; font: inherit; font-size: 13px; cursor: pointer; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 22px 18px; }
.card { text-decoration: none; display: block; }
.thumb { position: relative; aspect-ratio: 16/9; border-radius: 10px; overflow: hidden; background: var(--chip); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.badge { position: absolute; right: 6px; bottom: 6px; background: rgb(0 0 0 / .75); color: #fff; font-size: 12px; padding: 1px 6px; border-radius: 4px; }
.seen .thumb::after { content: ""; position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--accent); }
.card h3 { font-size: 15px; font-weight: 600; margin: 9px 0 2px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { color: var(--muted); font-size: 13px; }
.why { color: var(--muted); font: italic 13px/1.4 "Source Serif 4", Georgia, serif; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.watch { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 28px; }
@media (max-width: 1000px) { .watch { grid-template-columns: 1fr; } }
.player { aspect-ratio: 16/9; width: 100%; border: 0; border-radius: 12px; background: #000; }
.watch h1 { font: 600 22px/1.3 "Source Serif 4", Georgia, serif; margin: 14px 0 6px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 20px; }
.quote { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
.quote p { margin: 0 0 6px; font: 15px/1.5 "Source Serif 4", Georgia, serif; }
.quote .meta a { color: var(--accent); }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 24px 0 10px; }
.side .card { display: grid; grid-template-columns: 150px 1fr; gap: 10px; margin-bottom: 12px; }
.side .card h3 { margin-top: 0; font-size: 14px; }
.chip.on .meta { color: inherit; opacity: .8; }
.cats { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
.stance { display: inline-block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding: 1px 6px; border-radius: 4px; background: var(--chip); color: var(--muted); margin-left: 4px; }
.catgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
.catgrid a { text-decoration: none; }
.catgrid h3 { margin: 8px 0 0; font-size: 16px; }
.empty { color: var(--muted); padding: 40px 0; }
footer { color: var(--muted); font-size: 13px; max-width: 1400px; margin: 0 auto; padding: 0 16px 40px; }
button.more { display: block; margin: 28px auto 0; }
</style>
</head>
<body>
<header><div class="bar">
  <a class="logo" href="#/">LessWrong<span>Tube</span></a>
  <nav id="nav">
    <a href="#/" data-r="home">For you</a>
    <a href="#/top" data-r="top">Top</a>
    <a href="#/categories" data-r="categories">Categories</a>
    <a href="#/liked" data-r="liked">Liked</a>
    <a href="#/later" data-r="later">Later</a>
    <a href="#/history" data-r="history">History</a>
    <a href="#/about" data-r="about">About</a>
  </nav>
  <div class="search"><input id="q" type="search" placeholder="Search titles and channels" aria-label="Search"></div>
</div></header>
<main id="app"><p class="empty">Loading…</p></main>
<footer>Not affiliated with LessWrong or Lightcone. Data from public LessWrong posts and comments (CC BY 4.0). Your likes and history stay in this browser.</footer>
<script>
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem("lwt:" + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("lwt:" + k, JSON.stringify(v)); } catch {} },
};
let DATA = [], BY = {}, page = 0, cat = "";
const CATS = {
  "ai-safety": "AI safety", "ai": "AI & ML", "rationality": "Rationality & mind", "math-cs": "Math & CS",
  "science": "Science", "philosophy": "Philosophy", "society": "Economics, politics & history",
  "futures": "EA & futures", "self": "Health & self", "culture": "Culture & fun", "other": "Other",
};
const STANCE_LABEL = { mixed: "debated", critique: "critiqued" };
const PAGE = 48;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const liked = () => store.get("liked", []);
const later = () => store.get("later", []);
const history = () => store.get("history", []);
const toggle = (k, id) => { const s = store.get(k, []); const i = s.indexOf(id); i < 0 ? s.unshift(id) : s.splice(i, 1); store.set(k, s); };

function thumb(id) {
  // hq2.jpg is YouTube's auto-generated frame from the middle of the video, not the uploader's thumbnail.
  return `<img loading="lazy" src="https://i.ytimg.com/vi/${id}/hq2.jpg" onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/${id}/hqdefault.jpg'" alt="">`;
}
function card(v) {
  const seen = history().includes(v.id) ? " seen" : "";
  const why = v.hook ? `<div class="why">${esc(v.hook)}</div>` : v.quotes[0]?.text ? `<div class="why">“${esc(v.quotes[0].text)}”</div>` : "";
  const st = STANCE_LABEL[v.stance] ? `<span class="stance">${STANCE_LABEL[v.stance]}</span>` : "";
  return `<a class="card${seen}" href="#/v/${v.id}">
    <div class="thumb">${thumb(v.id)}<span class="badge">${v.people} ${v.people === 1 ? "rec" : "recs"}</span></div>
    <div><h3>${esc(v.title)}</h3><div class="meta">${esc(v.channel)} · ${v.last.slice(0, 4)}${st}</div>${why}</div></a>`;
}

// "For you": base rank plus a boost from the neighbors of what you liked or watched.
function personalized() {
  const seeds = [...liked().map(id => [id, 1.0]), ...history().slice(0, 30).map(id => [id, 0.4])];
  const boost = {};
  for (const [id, w] of seeds) (BY[id]?.related || []).forEach((r, i) => { boost[r] = (boost[r] || 0) + w * (1 - i / 14); });
  const hide = new Set([...history(), ...liked()]);
  const salt = store.get("salt", null) ?? (() => { const s = Math.random(); store.set("salt", s); return s; })();
  const jitter = id => { let h = 0; for (const c of id + salt) h = (h * 31 + c.charCodeAt(0)) | 0; return (h >>> 0) / 4294967296; };
  return DATA.filter(v => !hide.has(v.id))
    .map(v => [v, Math.log1p(v.score) + 1.5 * (boost[v.id] || 0) + 0.6 * jitter(v.id)])
    .sort((a, b) => b[1] - a[1]).map(x => x[0]);
}

let topSort = "score";
function listView(title, items, opts = {}) {
  const app = document.getElementById("app");
  const q = document.getElementById("q").value.trim().toLowerCase();
  if (q) items = items.filter(v => (v.title + " " + v.channel + " " + (v.hook || "")).toLowerCase().includes(q));
  const counts = {}; items.forEach(v => counts[v.category] = (counts[v.category] || 0) + 1);
  if (cat) items = items.filter(v => v.category === cat);
  const chips = opts.cats === false ? "" : `<div class="cats"><button class="chip ${cat ? "" : "on"}" data-cat="">All</button>${Object.entries(CATS).filter(([k]) => counts[k])
    .map(([k, l]) => `<button class="chip ${cat === k ? "on" : ""}" data-cat="${k}">${l} <span class="meta">${counts[k]}</span></button>`).join("")}</div>`;
  const shown = items.slice(0, (page + 1) * PAGE);
  app.innerHTML = `${chips}<div class="sub">${opts.sub || ""}<span>${items.length.toLocaleString()} videos</span></div>
    ${items.length ? `<div class="grid">${shown.map(card).join("")}</div>` : `<p class="empty">${opts.empty || "Nothing here yet."}</p>`}
    ${shown.length < items.length ? `<button class="chip more" id="more">Show more</button>` : ""}`;
  document.getElementById("more")?.addEventListener("click", () => { page++; route(true); });
  app.querySelectorAll("[data-cat]").forEach(b => b.addEventListener("click", () => { cat = b.dataset.cat; page = 0; route(); }));
  app.querySelectorAll("[data-sort]").forEach(b => b.addEventListener("click", () => { topSort = b.dataset.sort; page = 0; route(); }));
}

function watch(id) {
  const v = BY[id];
  const app = document.getElementById("app");
  if (!v) { app.innerHTML = `<p class="empty">Video not found.</p>`; return; }
  const h = history().filter(x => x !== id); h.unshift(id); store.set("history", h.slice(0, 500));
  const quotes = v.quotes.map(q => `<div class="quote"><p>“${esc(q.text)}”</p>
    <div class="meta">${esc(q.user)} · ${q.karma} karma · ${q.date} · <a href="${esc(q.url)}" target="_blank" rel="noopener">${q.kind} on “${esc(q.post)}”</a></div></div>`).join("");
  const threads = v.threads.map(t => `<li><a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.title)}</a></li>`).join("");
  const related = v.related.map(r => BY[r]).filter(Boolean);
  app.innerHTML = `<div class="watch"><div>
      <iframe class="player" src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="${esc(v.title)}"></iframe>
      <h1>${esc(v.title)}</h1>
      <div class="meta"><a href="${esc(v.channel_url)}" target="_blank" rel="noopener">${esc(v.channel)}</a> · <a href="#/top" onclick="cat='${v.category}'">${CATS[v.category] || "Other"}</a>${STANCE_LABEL[v.stance] ? ` <span class="stance">${STANCE_LABEL[v.stance]}</span>` : ""} · recommended by ${v.people} ${v.people === 1 ? "person" : "people"} · ${v.mentions} mentions, ${v.first.slice(0, 4)}–${v.last.slice(0, 4)}</div>
      ${v.hook ? `<p style="font:17px/1.5 'Source Serif 4',Georgia,serif;margin:10px 0 0">${esc(v.hook)}</p>` : ""}
      <div class="actions">
        <button class="chip ${liked().includes(id) ? "on" : ""}" id="like">${liked().includes(id) ? "Liked" : "Like"}</button>
        <button class="chip ${later().includes(id) ? "on" : ""}" id="later">${later().includes(id) ? "In watch later" : "Watch later"}</button>
        <a class="chip" href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">Open on YouTube</a>
      </div>
      <h2>Why LessWrong shared it</h2>${quotes || `<p class="meta">No quotable context.</p>`}
      ${threads ? `<h2>Threads</h2><ul>${threads}</ul>` : ""}
    </div>
    <aside class="side"><h2>Shared alongside</h2>${related.length ? related.map(card).join("") : `<p class="meta">No co-mentions yet.</p>`}</aside></div>`;
  document.getElementById("like").onclick = () => { toggle("liked", id); watch(id); };
  document.getElementById("later").onclick = () => { toggle("later", id); watch(id); };
  window.scrollTo(0, 0);
}

function about() {
  document.getElementById("app").innerHTML = `<div style="max-width:680px;font:17px/1.6 'Source Serif 4',Georgia,serif">
    <h1>About</h1>
    <p>LessWrongTube lists the YouTube videos that LessWrong posts and comments keep linking to, from 2006 to May 2026. It was built from a public crawl of ${DATA.length ? "about 46,000 posts and 906,000 comments" : "LessWrong"} (<a href="https://huggingface.co/datasets/x65617379/lesswrong_260509">dataset</a>).</p>
    <p>A video is ranked by how many <em>different people</em> linked it, with karma as a tiebreaker. A video enters the list if at least two people linked it, or one person did in a comment with 15+ karma. Deleted and private videos are dropped.</p>
    <p>Thumbnails are YouTube's automatic frame from the middle of the video, not the uploader's thumbnail. "For you" is computed in your browser from what you liked and watched, using videos shared in the same threads or by the same people. Nothing leaves your browser.</p>
    <p>Being linked is not being endorsed. Claude read the quotes around each link, in batches of 40 videos per call, and labeled the category, whether LessWrong recommends, cites, debates or critiques the video, and a one-line summary. Critiqued videos rank lower. Labels are machine-made: read the quotes. Code and data: <a href="https://github.com/franklinbaldo/lesswrongtube">github.com/franklinbaldo/lesswrongtube</a>. Inspired by HackerTube.</p></div>`;
}

function route(keepPage) {
  if (!keepPage) page = 0;
  const parts = location.hash.replace(/^#\/?/, "").split("/");
  const r = parts[0] || "home";
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.r === r));
  if (r === "v") return watch(parts[1]);
  if (r === "about") return about();
  if (r === "categories") {
    const html = Object.entries(CATS).map(([k, l]) => {
      const vs = DATA.filter(v => v.category === k); if (!vs.length) return "";
      return `<a href="#/top" onclick="cat='${k}'"><div class="thumb">${thumb(vs[0].id)}<span class="badge">${vs.length}</span></div><h3>${l}</h3><div class="meta">${esc(vs.slice(0, 3).map(v => v.title).join(" · "))}</div></a>`;
    }).join("");
    document.getElementById("app").innerHTML = `<div class="catgrid">${html}</div>`; return;
  }
  if (r === "top") {
    const sorts = { score: (a, b) => b.score - a.score, recent: (a, b) => b.last.localeCompare(a.last), classic: (a, b) => a.first.localeCompare(b.first) || b.score - a.score };
    const items = [...DATA].sort(sorts[topSort]);
    const sub = [["score", "Most recommended"], ["recent", "Recently mentioned"], ["classic", "Oldest first"]]
      .map(([k, l]) => `<button class="chip ${topSort === k ? "on" : ""}" data-sort="${k}">${l}</button>`).join("");
    return listView("Top", items, { sub });
  }
  const lists = { liked: liked(), later: later(), history: history() };
  if (lists[r]) return listView(r, lists[r].map(id => BY[id]).filter(Boolean), { empty: r === "liked" ? "Like videos to tune your feed." : "Nothing here yet." });
  listView("For you", personalized(), { sub: liked().length || history().length ? "<span>Tuned to your likes and history ·</span>" : "<span>Most recommended, lightly shuffled ·</span>" });
}

document.getElementById("q").addEventListener("input", () => { if (location.hash.startsWith("#/v/")) location.hash = "#/top"; route(); });
addEventListener("hashchange", () => route());
fetch("data.json").then(r => r.json()).then(d => {
  DATA = d.videos; BY = Object.fromEntries(DATA.map(v => [v.id, v])); route();
}).catch(() => { document.getElementById("app").innerHTML = `<p class="empty">Could not load data.json.</p>`; });
</script>
</body>
</html>
